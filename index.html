<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>막차</title>
<meta name="description" content="좀비가 들끓는 도시를 낡은 시내버스 한 대로 빠져나가요. 정류장마다 사람을 태우고, 실시간으로 대원을 지휘해 살아남는 이야기.">
<meta property="og:title" content="막차">
<meta property="og:description" content="좀비 도시를 버스 한 대로 빠져나가는 실시간 지휘 생존기. PC에서 해 주세요.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{--bg:#0b0d10;--panel:#151920;--panel2:#1c212a;--line:#2a313b;--text:#e8eaed;--dim:#8f98a5;--red:#ef5350;--yellow:#f5c542;--green:#4cc38a;--purple:#b392f0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
#wrap{max-width:1320px;margin:0 auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
#top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.hud-l{display:flex;align-items:center;gap:12px;padding:6px 10px}
.hud-r{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.plaque{font-weight:800;font-size:18px;padding:6px 26px;text-align:center;white-space:nowrap}
#stage{position:relative;display:flex;justify-content:center}
#dock{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;align-items:start}
#info{display:none}body.showlog #info{display:block}
#danger{position:absolute;left:14px;top:12px;max-width:46%;pointer-events:none;display:flex;flex-direction:column;gap:3px}
#danger:empty{display:none}
#danger div{background:#000000c0;border-radius:5px;padding:3px 9px;font-size:13px;border:none!important}
#ctxbtn{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;gap:8px}
#ctxbtn button{font-size:16px;font-weight:800;padding:10px 18px;white-space:nowrap;animation:pop .25s}
#ctxbtn button.go{background:#3f8f3a;border-color:#173a14;color:#fff}
#ctxbtn button.warn{background:#b5462f;border-color:#4a160c;color:#fff}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#side{padding:8px}
#orders{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#orders button.big{font-size:19px;font-weight:800;padding:14px 10px;text-align:center}
#acts{display:flex;gap:6px}#acts button{font-size:12px;padding:6px 10px;white-space:nowrap}

.dl{display:flex;flex-direction:column;gap:8px;min-width:0}
.actbox{padding:6px}

.title{font-weight:800;font-size:18px}.title small{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
#noisebox{flex:1;min-width:180px}
#noisebar{height:14px;background:#22272f;border-radius:4px;position:relative;overflow:hidden}
#noisefill{height:100%;width:0;transition:width .2s}
#noisebar i{position:absolute;top:0;bottom:0;width:2px;background:#0008}
#noiselbl{font-size:12px;color:var(--dim);margin-top:2px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:13px;white-space:nowrap}
.stat b{color:#fff}
#cv{width:100%;height:auto;display:block;border-radius:8px;background:#000;cursor:crosshair}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;background:#000000b8;color:#e9e1d0;padding:4px 12px;border-radius:6px;pointer-events:none;font-size:13px;text-align:center}
#hint:empty{display:none}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px;cursor:pointer;min-width:0}
.card.ctrl{border-color:#fff;box-shadow:0 0 0 1px #fff5 inset}
.card.gone{opacity:.45}
#cutin{position:absolute;left:50%;top:8px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:rgba(28,18,11,.92);border:2px solid #ffd166;border-radius:6px;font-size:14px;color:#fbefd9;transition:opacity .2s,transform .2s;z-index:5;white-space:nowrap}
#stage.frz #cv{filter:grayscale(1) contrast(1.15) brightness(.85)}
#frz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:6}
#frz.show{display:flex}#frz .ct{font-size:30px;font-weight:bold;color:#ffd400;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;letter-spacing:1px;animation:stamp .25s ease-out;padding:0 12px;text-align:center}
#frz .ci{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.78);border-left:6px solid #ffd400;padding:10px 16px;font-size:19px;color:#ffd400;font-weight:bold;max-width:88%;animation:slidein .2s ease-out;text-shadow:2px 2px 0 #000}
#frz .ci .face{width:56px;height:56px;flex:none}
@keyframes stamp{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}@keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:980px){#frz .ct{font-size:18px}#frz .ci{font-size:13px}#frz .ci .face{width:36px;height:36px}}
#live{position:absolute;right:10px;top:44px;width:180px;display:none;flex-direction:column;gap:2px;pointer-events:none;font-size:12px;z-index:4}
#live.show{display:flex}#live .lh{background:rgba(0,0,0,.7);color:#fff;padding:2px 6px;border-radius:3px;align-self:flex-start}#live .lh b{color:#ff4d4d}
#live .lc{background:rgba(0,0,0,.5);color:#e8f7ff;padding:1px 6px;border-radius:3px;animation:slidein .25s ease-out;text-shadow:1px 1px 0 #000}
@media (max-width:980px){#live{width:130px;font-size:10px;top:6px}}
#cutin.show{opacity:1;transform:translate(-50%,0)}#cutin .face{width:32px;height:32px}#cutin span{color:#ffd166;font-weight:bold}
.photo{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:2px solid #8a5a32;border-radius:5px;padding:5px 8px;margin:4px 0;font-size:13px}.photo .face{width:44px;height:44px}
.quote{font-size:13px;margin:2px 0;padding:3px 8px;border-left:3px solid #ffd166;background:rgba(255,209,102,.06)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}.photo.sm{font-size:12px;padding:3px 6px;margin:0}.photo.sm .face{width:32px;height:32px}
.face{display:inline-block;width:28px;height:28px;border-radius:5px;vertical-align:middle;object-fit:cover;image-rendering:pixelated;background:#2a1c13}
.card .face{float:left;width:36px;height:36px;margin:0 6px 0 -2px}
.chip .face{width:24px;height:24px;margin:-3px 5px -3px -6px;border-radius:50%}
.person .face{float:left;width:46px;height:46px;margin:0 8px 0 0}
.person::after,.card::after{content:"";display:block;clear:both}
.card .st{overflow:hidden;flex-wrap:nowrap!important;height:18px}
.hud-r{flex-wrap:nowrap!important}.hud-r .stat{white-space:nowrap}
.card .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .jb{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bar{height:5px;background:#2a2f37;border-radius:3px;margin:3px 0;overflow:hidden}.card .bar b{display:block;height:100%}
.card .st{font-size:11px;display:flex;gap:4px;flex-wrap:wrap;min-height:16px}
.mini{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.mini i{font-style:normal;font-size:11px;border:1px solid #3a414c;border-radius:4px;padding:1px 4px;cursor:pointer;background:#20252e}
.mini i:hover{background:#2c3340}.mini i.on{border-color:#f5c542;color:#ffe08a}
.mini.far i{opacity:.4}
#d-go,#n-go{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 14px rgba(21,25,32,.95)}
#ordpop{position:fixed;z-index:9;display:none;background:#151920;border:1px solid #4a5260;border-radius:8px;padding:8px;box-shadow:0 6px 20px #000a}
#ordpop button{padding:5px 9px;margin:2px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;margin:6px 0}
.bars i{font-style:normal;letter-spacing:1px;color:#f5c542}
.combo{font-size:13px;padding:2px 0}.combo.off{color:#6b7380}
.tag{padding:0 4px;border-radius:4px;background:#2a2f37;white-space:nowrap}
.tag.p{background:#3b2d5c;color:#d9c8ff}.tag.r{background:#5a2326;color:#ffc9c9}.tag.g{background:#1f4030;color:#bdf0d2}.tag.y{background:#4a3c14;color:#ffe7a0}.tag.b{background:#1d3550;color:#bfe0ff}
#side{display:flex;flex-direction:column;gap:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.box h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid #39414d;border-radius:7px;padding:7px 8px;cursor:pointer;text-align:left}
button:hover{background:#252b36}
button.on{border-color:var(--yellow);background:#3a3218}
button.off{opacity:.42}
button.wide{grid-column:1/3}
kbd{font-family:inherit;font-size:10px;color:var(--dim);border:1px solid #3a414c;border-radius:3px;padding:0 4px;float:right;margin-left:4px}
#danger div{font-size:12.5px;padding:2px 0;border-bottom:1px dashed #262c35}
#danger .none{color:var(--dim)}
#log{max-height:96px;overflow:auto;font-size:12px;line-height:1.5}
#log div{border-bottom:1px dashed #22272f}
#log div:first-child{color:#fff}
#modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.hidden{display:none}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:94vh;overflow:auto;padding:18px 20px;line-height:1.6}
#mbox h2{margin:0 0 4px;font-size:22px}#mbox h3{margin:12px 0 4px;font-size:15px;color:var(--yellow)}
#mbox ul,#mbox ol{margin:4px 0;padding-left:20px}
#mbox .go{display:block;width:100%;margin-top:12px;text-align:center;font-weight:800;font-size:16px;padding:11px;background:#2c5a3e;border-color:#4cc38a}
#mbox .alt{display:block;width:100%;margin-top:8px;text-align:center;padding:9px}
#mbox .story{background:#10141a;border-left:3px solid #5a6b80;padding:8px 12px;border-radius:4px;color:#d7dde4;white-space:pre-line}
.res td{padding:3px 10px 3px 0;vertical-align:top}
.dim{color:var(--dim);font-size:13px}
.route{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:8px 0}
.rmap{margin:8px 0 6px;background:#10141a;border:1px solid var(--line);border-radius:10px;padding:8px 10px 4px}
.rhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--dim)}
.rhead b{color:#ffd36b}
.rwrap{overflow-x:auto;overflow-y:hidden}
.rline{position:relative;height:100px}
.rtrack{position:absolute;left:10px;right:10px;top:38px;height:6px;background:#2f6b45;border-radius:3px}
.rhorde{position:absolute;left:0;top:34px;height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(200,40,40,.1),rgba(235,70,70,.8));min-width:10px}
.rhorde span{position:absolute;right:0;top:-17px;font-size:11px;font-weight:700;color:#ff8a8a;white-space:nowrap}
.rstop{position:absolute;top:0;width:62px;text-align:center}
.rstop .dot{margin:24px auto 0;width:32px;height:32px;border-radius:50%;background:#1c212a;border:3px solid #4a5260;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;z-index:1}
.rstop.done .dot{opacity:.4}
.rstop.cur .dot{border-color:#ffd36b;background:#3a3218;box-shadow:0 0 0 3px rgba(255,211,107,.25)}
.rstop .nm{font-size:11px;line-height:1.2;margin-top:2px;word-break:keep-all}
.rstop.done .nm{color:var(--dim)}
.rstop .hn{font-size:11px;margin-top:1px}
.rbus{position:absolute;top:2px;left:0;right:0;font-size:15px}
.chip{display:inline-block;padding:3px 9px;margin:2px;border:1px solid;border-radius:12px;font-size:13px;background:#1c212a}
.node{border:1px solid #39414d;border-radius:8px;padding:5px 7px;font-size:12px;text-align:center;min-width:62px;background:#1a1f27}
.node.done{opacity:.45}.node.cur{border-color:#f5c542;background:#3a3218;font-weight:700}
.node .ic{font-size:16px;display:block}
.arrow{color:#556}
.res4{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.res4 .stat{font-size:14px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.person{background:#1a1f27;border:1px solid #2f3742;border-radius:7px;padding:5px 8px;font-size:13px}
.person.sel{border-color:#4cc38a;background:#1d3328}
.person.no{opacity:.45}
.choice{display:block;width:100%;margin-top:8px;padding:10px 12px;text-align:left}
.choice small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
@media (max-width:980px){#top{grid-template-columns:1fr}.hud-r{justify-content:flex-start}.plaque{order:-1}#dock{grid-template-columns:1fr}#cv{width:100%!important;height:auto!important}#danger{position:static;max-width:none;margin-top:4px}#ctxbtn{position:static;transform:none;justify-content:center;margin-top:6px}#stage{flex-direction:column}#hint{position:static;transform:none;max-width:none;margin-top:6px;font-size:12px}#side{order:-1}#cards{grid-template-columns:repeat(3,1fr)}.people{grid-template-columns:1fr}}
/* ===== 나무 틀 + 도트 글꼴 (시험). 주소 끝에 ?skin=old 를 붙이면 예전 모습 ===== */
body.wood{--wood-dk:#1c120b;--wood:#8a5a32;--wood-lt:#c08a52;--panel:#2a1c13;--panel2:#3a281b;--line:#5a3a22;--dim:#c9b08e;--text:#fbefd9;
  font-family:"Galmuri11","Malgun Gothic",sans-serif;background:#120c08}
body.wood .box,body.wood #mbox,body.wood .stat{background:var(--panel);border:3px solid var(--wood-dk);border-radius:6px;
  box-shadow:inset 0 0 0 3px var(--wood),inset 0 0 0 5px #5a3920,0 3px 0 #000a}
body.wood .box{padding:11px}
body.wood #mbox{padding:22px 24px}
body.wood .box h4{color:#ffd98a;letter-spacing:.5px}
body.wood #mbox h2{display:inline-block;background:#4a2f1c;border:2px solid var(--wood-dk);box-shadow:inset 0 0 0 2px var(--wood-lt);padding:4px 14px;border-radius:4px;color:#ffe7b0;font-size:20px}
body.wood #mbox h3{color:#ffd166}
body.wood #mbox .story{background:#1b120c;border-left:3px solid var(--wood-lt);color:#f3e3c7}
body.wood button{background:#4a3222;border:2px solid var(--wood-dk);border-radius:5px;box-shadow:inset 0 -3px 0 #0006,inset 0 2px 0 #ffffff1f;color:#fbefd9}
body.wood button:hover{filter:brightness(1.15)}
body.wood button:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #0006}
body.wood #mbox .go{background:#3f8f3a;border-color:#173a14;box-shadow:inset 0 -4px 0 #1f5a1c,inset 0 2px 0 #ffffff33;color:#fff;text-shadow:0 2px 0 #0007}
body.wood .choice{background:#3a281b}
body.wood #orders button:nth-child(1){background:#3f8f3a}body.wood #orders button:nth-child(2){background:#c98a1f}
body.wood #orders button,body.wood #acts button{text-shadow:0 2px 0 #0008;font-weight:700}
body.wood .card{background:color-mix(in srgb,var(--cc,#555) 38%,#2a1c13);border:3px solid var(--wood-dk);border-radius:6px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cc,#888) 70%,#fff 10%)}
body.wood .card.ctrl{border-color:#fff3c4;box-shadow:inset 0 0 0 2px #ffd166,0 0 10px #ffd16688}
body.wood .card .face{border:2px solid var(--wood-dk);background:#e9d5aa}
body.wood .person .face,body.wood .chip .face{background:#e9d5aa}
body.wood .card .bar{height:6px;border:1px solid #000;border-radius:2px;background:#1a0f0a}
body.wood #cv{border:4px solid var(--wood-dk);box-shadow:0 0 0 3px var(--wood),0 0 0 5px #5a3920;border-radius:4px}
body.wood .tag{border-radius:3px}
.scene{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;border:3px solid #1c120b;box-shadow:0 0 0 2px #8a5a32;border-radius:4px;margin:6px 0 8px;background:#0b0d10}
.scene:not(.title){max-height:210px}
.scene.title,.scene.story{aspect-ratio:auto;max-height:none!important}
.tsmall{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.tsmall .alt{flex:1;font-size:12px;padding:6px 4px;margin:0}
.sdots{text-align:center;letter-spacing:4px;color:#8a7558;font-size:12px;margin:2px 0}.sdots b{color:#ffd166}
.titlewrap{position:relative}.titlewrap h2{position:absolute;left:50%;top:14px;transform:translateX(-50%);margin:0!important;font-size:28px!important;box-shadow:0 4px 0 #000a}
.rline.banner{background-size:cover;background-position:center;image-rendering:pixelated;border-radius:4px}
.rline.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.45));border-radius:4px}
.rline.banner .nm{color:#fff3d6!important;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.rline.banner .hn{text-shadow:0 1px 0 #000}
/* 노선도: 낡은 종이 지도 */
body.wood .rmap{background:#dcc391;border:3px solid var(--wood-dk);box-shadow:inset 0 0 0 3px #a87a46,inset 0 0 18px #8a5a2a55;color:#3b2614;border-radius:6px}
body.wood .rmap .dim{color:#6b5236}
body.wood .rhead{color:#5a3f24}body.wood .rhead b{color:#8a2b10}
body.wood .rhead b[style]{color:#a3150b!important}
body.wood .rtrack{background:#6b5b4b;height:10px;top:36px;border-radius:2px;box-shadow:0 2px 0 #3b2e23}
body.wood .rtrack::after{content:'';position:absolute;left:0;right:0;top:4px;height:2px;background:repeating-linear-gradient(90deg,#f1d36b 0 8px,transparent 8px 16px)}
body.wood .rhorde{background:linear-gradient(90deg,rgba(150,20,20,.15),rgba(190,30,30,.75));top:31px;height:20px;filter:blur(1px)}
body.wood .rstop .dot{background:#f6e7c4;border:3px solid #5a3a22;box-shadow:0 2px 0 #3b2614}
body.wood .rstop.cur .dot{background:#ffd166;border-color:#8a2b10;box-shadow:0 0 0 3px #ffffff88,0 2px 0 #3b2614}
body.wood .rstop .nm{color:#3b2614;font-weight:700}body.wood .rstop.done .nm{color:#8a7558;font-weight:400}
body.wood .rwrap::-webkit-scrollbar{height:8px}body.wood .rwrap::-webkit-scrollbar-thumb{background:#8a5a32;border-radius:4px}
/* 사람 고르기·칩 */
body.wood .person{background:#3a281b;border:2px solid #5a3a22;border-radius:5px}
body.wood .person.sel{background:#2f4a22;border-color:#7fd36b}
body.wood .chip{background:#3a281b;border-width:2px}
body.wood .stat b{color:#fff3d6}
body.wood .plaque{background:#4a2f1c;border:3px solid var(--wood-dk);box-shadow:inset 0 0 0 3px var(--wood-lt),0 3px 0 #000a;border-radius:6px;color:#ffe7b0;text-shadow:0 2px 0 #000a}
body.wood .title{color:#ffd166;font-size:20px;text-shadow:0 2px 0 #000}
body.wood #noisebar{background:#1a0f0a;border:2px solid #000;border-radius:3px}
body.wood .stat{padding:6px 12px;font-size:14px}
body.wood #hint{background:#1c120bdd;border:2px solid var(--wood);color:#fbefd9}

</style>
</head>
<body>
<script>if (!/skin=old/.test(location.search)) document.body.classList.add("wood");</script>
<div id="wrap">
  <div id="top">
    <div class="hud-l box"><div class="title">막차</div>
      <div id="noisebox"><div id="noisebar"><div id="noisefill"></div><i style="left:30%"></i><i style="left:60%"></i><i style="left:90%"></i></div><div id="noiselbl"></div></div></div>
    <div class="plaque"><span id="subtitle">1막 「출발」</span></div>
    <div class="hud-r">
      <div class="stat">⏱ <b id="timer">0:00</b></div>
      <div class="stat" id="objstat">📦 <b id="boxes">0 / 3</b></div>

function widenDef(def){

  const mv = v => {
    if (Array.isArray(v)){ if (v.length >= 2 && typeof v[0] === 'number' && typeof v[1] === 'number') return [sx(v[0]), ...v.slice(1)]; return v.map(mv); }
    if (v && typeof v === 'object'){ const o = { ...v }; if (typeof o.x === 'number') o.x = sx(o.x); for (const k of ['at']) if (o[k]) o[k] = mv(o[k]); return o; }
    return v; };

  if (wd.corpses) d.corpses = [...(d.corpses || []), ...wd.corpses];

    for (const row of m){ const col = row[wd.at]; row.splice(wd.at, 0, ...Array(wd.by).fill(col === '~' || col === 'P' || col === 'A' || col === 'S' ? '.' : col)); }

      set.car = (x,y,c='P') => { set(x,y,c); set(x,y+1,c); };

function goNode(){
  save();
  const q = [];
  for (const id of alive()){ const r = C.people[id]; if (r.bitten && r.bitLeft > 0){ r.bitLeft--; if (r.bitLeft <= 0) q.push(id); } }
  if (q.length){ return biteEvent(q[0], goNode); }
  if (C.node >= route().length) return actEnd();
  if (!alive().some(id => !CHARS[id].noFight && !CHARS[id].dog)) return gameOver('싸울 수 있는 사람이 아무도 남지 않았어요.');
  if (C.pendingSiege){ C.pendingSiege = false; return siegeIntro(); }
  const n = route()[C.node];
  const morning = (C.morning || []).length ? `<div class="story" style="border-left:3px solid #6b7fa8">🌅 ${C.morning.join('<br>')}</div>` : ''; C.morning = null;
  const head = `<h2>${n.icon} ${nodeName(n)}</h2><div class="dim">${curAct().short} · 정류장 ${C.node+1} / ${route().length} · ${Math.floor(C.half/2)+1}일째 ${C.half%2 ? '오후' : '오전'}</div>${routeHtml()}${morning}${resRow()}`;
  if (n.type === 'battle'){
    if (n.pre === 'kal' && has('kal') && !C.preDone[n.id]) return kalStory(n, head);
    return deployScreen(n.map, head);
  }
  if (n.type === 'event'){
    if (n.ev === 'checkpoint') return checkpointEvent(head);
    return eventScreen(n.ev === 'random' ? pickEvent(['store','police','granny','gas']) : n.ev === 'random2' ? pickEvent(['cry','bus3km','fuelthief','ambulance']) : n.ev === 'random3' ? pickEvent(['hungry','buses','yoonnote']) : n.ev === 'random4' ? pickEvent(['beach','flooded']) : n.ev, head);
  }
  if (n.type === 'meeting') return meetingScreen(head);
  if (n.type === 'finale') return deployScreen(PLANS[C.plan || 'conductor'].map, head);
  if (n.type === 'choice') return branchScreen(n, head);
  if (n.type === 'shelter') return shelterScreen(head);
  if (n.type === 'village') return n.village === 'market' ? marketScreen(head) : villageScreen(head);
}

}

function teamStats(ids){
  const chs = ids.map(id => CHARS[id]).filter(c => c && !c.noFight);
  if (!chs.length) return null;
  const noise = chs.reduce((a,c) => a + (c.weapon.kind === 'gun' ? c.weapon.noise : 0) + (c.dog ? 1.5 : 0), 0);
  const fire = chs.reduce((a,c) => a + (c.weapon.dmg[0]+c.weapon.dmg[1])/2 / c.weapon.cd * (c.weapon.range ? 1.3 : 1), 0);
  const tough = chs.reduce((a,c) => a + c.hp + (c.role === '막이' ? 6 : 0), 0);
  const spd = chs.reduce((a,c) => a + c.spd, 0) / chs.length;
  const cl = v => Math.max(0, Math.min(5, Math.round(v)));
  return { 소란: cl(noise <= 0 ? 0 : noise <= 1.5 ? 1 : noise <= 3.5 ? 2 : noise <= 6 ? 3 : noise <= 9 ? 4 : 5), 화력: Math.max(1, cl(fire/4)), 버티기: Math.max(1, cl(tough/18)), 속도: Math.max(1, cl((spd-1.6)*4)) };
}
function teamHtml(sel){

  const act = activeCombos(sel), near = COMBOS.filter(c => !act.includes(c) && (c.who === '막이2' ? pool.filter(id => CHARS[id].role === '막이').length >= 2 : c.who.every(id => pool.includes(id))));
  return `<h3>팀 성향</h3><div class="bars">${Object.entries(t).map(([k,v]) => `<span>${k}</span><span><i>${'●'.repeat(v)}${'○'.repeat(5-v)}</i></span>`).join('')}</div>
    <h3>조합 ${act.length ? '(' + act.length + '개 켜짐)' : ''}</h3>
    ${act.map(c => `<div class="combo">🤝 <b style="color:#f5c542">${c.name}</b> — ${c.desc}</div>`).join('')}
    ${near.map(c => `<div class="combo off">· ${c.name} (${c.who === '막이2' ? '막이 둘' : c.who.map(id => CHARS[id].name).join(' + ')})</div>`).join('')}`;
}

  else if (trueOk){ title = '⭐ 막차의 끝 (진엔딩)';
    story = `지휘자가 쓰러지자 박자가 끊겼어요. 금순 씨의 노래가 다리 위에 울려 퍼지고, 무리는 한 마리씩 사방으로 흩어졌어요.
섬 쪽 바리케이드에서 누군가 확성기를 들었어요. 한참 뒤, 낮은 목소리가 들렸어요. "…문을 열어라."
7번 마을버스가 천천히 다리를 건너요. 뒤따라 피난 차량들이 줄지어 건너요.${mom ? `
다리 끝에서 지호가 창문을 열고 소리쳤어요. "엄마!"` : ''}`; }
  else { title = '⭐ 지휘자는 쓰러졌지만';
    const miss = []; if (!has('geum')) miss.push('금순 씨가 살아 있어야 해요'); if (C.flags.grayGiven) miss.push('회색을 섬에 넘기지 않아야 해요'); if (alv.length < 8) miss.push(`대원이 8명 이상이어야 해요 (지금 ${alv.length}명)`);
    story = `지휘자가 쓰러지자 무리가 흩어지기 시작했어요. 그 순간 다리 아래에서 섬광이 일었어요.
섬은 기다려 주지 않았어요. 다리가 무너졌어요. 우리는 살아남았지만, 건널 길은 없어졌어요.
<span class="dim">진엔딩 조건: ${miss.join(' · ')}</span>`; }
  const seat = id => { const ch = CHARS[id], r = C.people[id];
    if (['ok','hurt'].includes(r.status)) return `<div class="person"><b style="color:${ch.color}">${ch.name}</b> <span class="dim">"${ENDING_SAY[id] || r.lastSaid || '…'}"</span></div>`;
    const why = r.status === 'home' ? '할머니 곁에 남았어요' : r.status === 'given' ? '섬에 넘겨졌어요' : '빈자리';
    return `<div class="person no"><b style="color:${ch.color}">${ch.name}</b> <span class="dim">— ${why}${r.lastSaid ? ` · 마지막 말: "${r.lastSaid}"` : ''}</span></div>`; };
  const endImg = plan === 'ship' ? 'end_ship' : plan === 'broadcast' ? 'end_broadcast' : plan === 'refuse' ? 'end_refuse' : trueOk ? 'end_true' : 'end_bitter';
  showModal(`<h2>${title}</h2>${sceneImg(endImg)}
    ${lines.length ? `<div class="story">${lines.join('<br>')}</div>` : ''}
    <div class="story">${story}</div>
    <h3>버스 좌석</h3><div class="people">${C.roster.map(seat).join('')}</div>
    ${(C.album || []).length ? '<h3>📸 막차 앨범</h3><div class="album">' + C.album.map(p => shotHtml(p, true)).join('') + '</div>' : ''}
    ${(C.quotes || []).length ? '<h3>📜 잊지 못할 한마디</h3>' + C.quotes.map(q => '<div class="quote"><b style="color:' + CHARS[q.id].color + '">' + CHARS[q.id].name + '</b> "' + q.text + '" <span class="dim">— ' + q.map + '</span></div>').join('') : ''}
    <div class="dim">싸움 ${C.stats.battles} · 업기 ${C.stats.carries} · 잃은 사람 ${C.stats.lost} · 다른 계획엔 다른 끝이 있어요</div>
    <button class="go" id="a-title">처음 화면</button>`);

function pickEvent(pool){ const left = pool.filter(e => !C.events.includes(e) && (!EVENTS[e].need || EVENTS[e].need())); const e = left.length ? pickR(left) : pool.find(e => !EVENTS[e].need) || pool[0]; C.events.push(e); return e; }

function checkpointEvent(head){
  const sus = alive().filter(id => C.people[id].doubt || (C.people[id].known && C.people[id].bitten));

  const check = () => { const lines = [];
    for (const id of sus){ const r = C.people[id];

  const ch = [];
  if (has('choi')) ch.push({ t:'최 순경이 반장님을 알아본다', d:'최 순경의 개인 이야기', f:() => { treat(2); C.food += 4; C.flags.choiBoss = true;
    return '"…최 순경? 살아 있었구나." 옛 파출소 반장님이에요. 검사 없이 통과! 💊 치료 2번, 🍚 식량 +4.\n반장님이 낮게 말했어요. "피난 행렬을 전부 남쪽 항구로 보내래. …이상하지 않냐?"'; } });
  ch.push({ t:'검사를 받는다', d: sus.length ? `물린 사람: ${sus.map(id => CHARS[id].name).join(', ')}` : '물린 사람은 없어요', f:check });
  if (sus.length) ch.push({ t:'물린 사람을 숨긴다', d:'들키면 그 사람을 잃어요', f:() => { if (rng() < .6) return '좌석 밑에 숨겼어요. 군인들은 대충 훑어보고 통과시켰어요.'; const id = sus[0]; C.people[id].status = 'gone'; C.stats.lost++; return `들켰어요. ${CHARS[id].name}${jo(CHARS[id].name,'이','가')} 끌려 내려갔어요.`; } });
  showModal(`${head}<h3>🪖 군 검문소</h3>${sceneImg('checkpoint')}<div class="story">방호복 군인들이 버스를 세워요. "물린 사람은 통과할 수 없습니다."
그런데 군인들은 오히려 빨리 남쪽으로 가라고 손짓해요.</div>
    ${ch.map((c,i) => `<button class="choice" data-i="${i}">${c.t}${c.d ? `<small>${c.d}</small>` : ''}</button>`).join('')}`);
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => { sfx('click'); TR = { ask:0, done:0 }; out(ch[+b.dataset.i].f()); });

function kalStory(n, head){
  C.preDone[n.id] = true;
  showModal(`${head}<h3>🏍 약탈단 「번개」</h3><div class="story">오토바이 엔진 소리가 주차장을 메워요. 맨 앞 오토바이에서 내린 남자를 보고, 칼자국이 굳어요.

    showModal(`<h3>🏍 약탈단 「번개」</h3><div class="story">칼자국이 혼자 걸어가 두목 앞에 섰어요. 한참 뒤, 식량 상자를 내주고 돌아왔어요.
칼자국: "…이번 한 번만이에요, 형님. 다음엔 없어요."
오토바이들이 멀어져 갔어요. 칼자국은 그날 밤 아무 말도 하지 않았어요. (🍚 −6)</div>${resRow()}<button class="go" id="e-go">다음 정류장으로</button>`);

function villageScreen(head){
  if (!C.villageRested){ C.villageRested = C.node; for (const id of alive()){ C.people[id].hp = Math.min(CHARS[id].hp, C.people[id].hp + 6); const r = C.people[id]; if (r.status === 'hurt'){ r.sit = Math.max(0, r.sit-1); if (!r.sit) r.status = 'ok'; } } }
  let boughtSerum = false;

    { id:'serum', name:'💉 혈청 1병 (한 번만)', cost:10, ok:() => C.food >= 10 && !boughtSerum, f:() => { C.food -= 10; C.serum++; boughtSerum = true; } },
  ];

모두 체력 +6 · 중상은 한 정류장 빨리 나아요.</div>
      ${resRow()}<h3>거래 (식량으로)</h3>
      ${trades.map(t => `<button class="choice ${t.ok()?'':'off'}" data-t="${t.id}">${t.name}<small>식량 ${t.cost}</small></button>`).join('')}

function actEnd(lines=[]){
  if (C.starAct !== C.act){ C.starAct = C.act; const vets = alive().filter(id => !CHARS[id].noFight);

  const story = C.act === 2

버스는 산을 내려가요. 창문 틈으로 바다 냄새가 들어와요. 라디오가 또 지직거려요. "…마지막 섬은 안전합니다… 오세요…"`

라디오는 여전히 같은 말을 되풀이해요. "…오세요… 오세요…"`
    : `군 기지의 불이 하나둘 꺼졌어요. ${has('ha') ? `하 중사가 창밖을 보며 입을 열었어요.
"명령은 하나였습니다. 피난 행렬을 막지 말 것. 남쪽 항구로 몰 것. …이유는 아무도 몰랐습니다."` : `대대장실 명령서의 한 줄이 계속 마음에 걸려요. "피난 행렬을 남쪽 항구로 유도할 것."`}

  showModal(`<h2>🎬 ${curAct().name} 끝</h2>

    <div class="story">${story}</div>

      return `<div class="person ${here?'':'no'}"><b style="color:${ch.color}">${ch.name}</b> ${here ? `<span class="dim">"${r.lastSaid || '…'}"</span>` : r.status === 'home' ? `<span class="dim">— 할머니 곁에 남았어요</span>` : `<span class="dim">— 빈자리</span>`}</div>`; }).join('')}</div>
    <div class="dim">싸움 ${C.stats.battles} · 업기 ${C.stats.carries} · 잃은 사람 ${lost.length}</div>

function gameOver(reason){

/* =====================================================================
   돌리기
   ===================================================================== */
let last = performance.now(), acc = 0, uiT = 0;
function frame(now){
  const realDt = Math.min(.25, (now-last)/1000); last = now;
  if (S && !S.paused && !S.over && !cineStep(now)){ acc += realDt*S.speed; while (acc >= T.tick){ step(T.tick); acc -= T.tick; } }
  uiT += realDt; if (uiT > .2){ uiT = 0; if (S) renderUI(); }
  draw(); requestAnimationFrame(frame);
}
window.DBG = {
  get S(){ return S; }, get C(){ return C; }, T, MAPS, ACT1, ACTS, CHARS, fast(v){ FAST = v !== false; },
  battle(mapId, party, opts){ hideModal(); newBattle(mapId, party || ['man','yuri','arin','kwan','baek','choi'], opts); S.paused = false; },
  run(sec){ const was = S.paused; S.paused = false; let n = Math.round(sec/T.tick); while (n-- > 0 && !S.over) step(T.tick); S.paused = was; renderUI(); },
  order: issueOrder, toggleQuiet, gunAll(g){ for (const h of S.humans) h.gun = (g === 'none' ? 'none' : 'save'); S.quiet = g === 'none'; }, switchCtrl, horn, light, depart, carryKey,
  moveCtrl(x,y){ S.ctrl.path = pathTo(S.ctrl, x, y); S.ctrl.atk = null; },
  win(){ if (S.obj === 'loot'){ for (const b of S.boxes.filter(b => b.kind !== 'bonus' && b.kind !== 'part').slice(0, S.need)) { b.taken = true; S.delivered.push(b); } } if (S.obj === 'boss'){ S.bossDead = true; } if (S.obj === 'hold') S.holdDone = true;
    for (const h of S.humans) if (!h.downed) { h.x = 2.5; h.y = 9.5; } S.ctrl.x = 2.5; finish('depart'); },
  newCampaign(){ newCampaign(); goNode(); }, goNode, titleScreen,
  api: { dist, pathTo, makeNoise, active, outside, laneDodge },
};
window.addEventListener('resize', () => { const d = Math.min(2, window.devicePixelRatio||1); if (d !== DPR) groundCache = null; sizeCanvas(); });
titleScreen();
requestAnimationFrame(frame);
})();
